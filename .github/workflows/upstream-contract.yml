name: Upstream contract

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install latest upstream core
        run: |
          mkdir -p dsh-runtime
          npm install --prefix dsh-runtime --no-audit --no-fund --ignore-scripts \
            --registry=https://registry.npmmirror.com @deepseek-ai/dsh@latest
          node -p "require('./dsh-runtime/node_modules/@deepseek-ai/dsh/package.json').version"

      - name: Check runtime compatibility
        run: node scripts/check-runtime-compat.js --runtime-dir dsh-runtime

      - name: Check upstream contract
        run: npm run check:upstream -- --runtime-dir dsh-runtime

      - name: Open or update an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '上游 DSH 契约检查失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '每日契约检查失败，当前 latest 内核与外壳不兼容或行为发生变化。',
              '',
              `运行记录: ${runUrl}`,
              '',
              '处理顺序见 docs/troubleshooting.md 7.3：确认失败步骤，更新适配层，验证通过后再调整 SUPPORTED_DSH_RANGE。'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const found = existing.data.find((issue) => issue.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
