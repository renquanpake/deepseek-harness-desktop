name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  DSH_VERSION: 0.1.0-rc.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify packaging manifest covers runtime entries
        run: node scripts/verify-packaging.js

      - name: Run test suite with coverage gate
        run: npm run test:coverage

  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match package.json version v$version"
          }
          Write-Host "tag $env:GITHUB_REF_NAME matches package version v$version"

      - name: Prepare DSH runtime
        run: npm run runtime:prepare

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Verify packaged app contains runtime entry points
        run: node scripts/verify-packaging.js --asar dist/win-unpacked/resources/app.asar

      - name: Sign update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATE_MANIFEST_KEY: ${{ secrets.UPDATE_MANIFEST_KEY }}
        run: |
          if (-not $env:UPDATE_MANIFEST_KEY) {
            Write-Host "UPDATE_MANIFEST_KEY is not configured; publishing an unsigned manifest."
            exit 0
          }
          $installer = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "installer not found in dist" }
          $version = node -p "require('./package.json').version"
          $keyFile = Join-Path $env:RUNNER_TEMP 'update-signing-key.pem'
          Set-Content -Path $keyFile -Value $env:UPDATE_MANIFEST_KEY -NoNewline -Encoding ascii
          try {
            node scripts/sign-update-manifest.js `
              --tag $env:GITHUB_REF_NAME `
              --version $version `
              --installer $installer.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --key $keyFile `
              --public-key build/update-public-key.pem `
              --out dist/latest.json
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path dist/latest.json)) { throw "signed manifest was not produced" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/latest.json
          if-no-files-found: error

  release:
    needs: [ build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        id: checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=( *.exe )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS.txt
          {
            echo "sums<<EOF"
            cat SHA256SUMS.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/latest.json
            dist/SHA256SUMS.txt
          body: |
            ### SHA-256 Checksums
            ```
            ${{ steps.checksums.outputs.sums }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
