name: Build Windows Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare DSH runtime & patches
        run: npm run runtime:prepare

      - name: Run test suite
        run: npm test

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Recurse -Include *.exe,*.zip -File |
            Where-Object { $_.Name -notlike '*.blockmap' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding UTF8

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Windows-Setup
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
