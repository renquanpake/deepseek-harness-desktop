name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check main.js
        run: node --check main.js

      - name: Syntax check preload.js
        run: node --check preload.js

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage gate
        run: npm run test:coverage

  e2e:
    name: Electron end-to-end
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      - name: Run Electron e2e suite
        run: xvfb-run --auto-servernum npm run test:e2e
