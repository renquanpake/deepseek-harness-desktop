<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg-primary: #121214;
      --bg-secondary: #18181b;
      --bg-tertiary: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-blue: #3b82f6;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-card {
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .splash-mark {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      border-radius: 14px;
      background: linear-gradient(145deg, #2563eb, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease infinite alternate;
    }
    .splash-mark span {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      from { transform: scale(0.95); opacity: 0.85; }
      to { transform: scale(1.05); opacity: 1; }
    }
    .splash-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .splash-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .splash-progress-track {
      width: 100%;
      height: 3px;
      background: var(--bg-tertiary);
      border-radius: 2px;
      overflow: hidden;
    }
    .splash-progress-bar {
      width: 40%;
      height: 100%;
      background: var(--accent-blue);
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-mark"><span>DH</span></div>
    <h1 class="splash-title">DeepSeek Harness</h1>
    <p class="splash-desc" id="splash-status-text">正在启动本地 AI 工作台...</p>
    <div class="splash-progress-track">
      <div class="splash-progress-bar"></div>
    </div>
  </div>
</body>
</html>
